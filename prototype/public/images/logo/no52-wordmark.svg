<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="currentColor" role="img" aria-label="No. 52 Cafe wordmark">
  <!-- In-repo recreation of the No. 52 Cafe primary wordmark (Brand Book v1.0
       p.15, "Primary"): a heavy "No52" ligature with a raised superscript "o"
       and large overlapping digits. Self-contained vector paths, currentColor,
       no web font. Official vector lives in the access-restricted Brand Kit;
       faithful redraw for the prototype. See ASSETS.md. -->
  <!-- N -->
  <path d="M4 14h22l30 50V14h22v82H56L26 47v49H4z" />
  <!-- Raised superscript "o" ring -->
  <path d="M92 26a17 17 0 1 1 0 34 17 17 0 0 1 0-34zm0 11a6 6 0 1 0 0 12 6 6 0 0 0 0-12z" />
  <!-- 5 (full height, slightly overlapping the o and the 2) -->
  <path d="M118 14h44v17h-27v14h13a26 26 0 0 1 0 52h-28V79h27a9 9 0 0 0 0-18h-29z" />
  <!-- 2 (full height, tucked against the 5) -->
  <path d="M196 41a27 27 0 0 1 54 0c0 9-5 16-12 22l-21 16h34v17h-58V79l34-26c4-3 6-6 6-12a9 9 0 0 0-18 0z" />
</svg>
