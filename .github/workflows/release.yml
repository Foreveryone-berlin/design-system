name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Title matches the dated heading without the ## prefix, e.g. [1.10.2] - 2026-10-05
          HEADER=$(awk "/^## \[${VERSION}\]/{sub(/^## /, \"\"); print; exit}" CHANGELOG.md)
          if [ -z "$HEADER" ]; then
            echo "Missing CHANGELOG heading for ${VERSION}" >&2
            exit 1
          fi
          {
            echo "title<<EOF"
            echo "$HEADER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Grab everything between the matching ## [X.Y.Z] header and the next ## header
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Keep the full section (summary paragraph + bullets); drop leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
          # Write to file to preserve newlines
          printf '%s\n' "$NOTES" > release-notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file release-notes.txt
