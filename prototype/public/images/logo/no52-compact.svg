<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 110" fill="currentColor" role="img" aria-label="No. 52 Cafe compact mark">
  <!-- In-repo recreation of the No. 52 compact mark (Brand Book v1.0 p.15,
       "Secondary"): a heavy N joined to a solid disc holding a reversed-out
       "52". Self-contained: digits are vector paths (no web font needed) and
       the disc uses currentColor, so it tints with the surrounding text colour.
       Official vector lives in the access-restricted Brand Kit; faithful redraw
       for the prototype. See ASSETS.md. -->
  <defs>
    <!-- White disc with black "52" digits; used as a mask so the 52 reads as a
         knockout (transparent) while the rest of the disc is solid. -->
    <mask id="no52c">
      <circle cx="108" cy="60" r="36" fill="#fff" />
      <!-- 5 -->
      <path d="M91 48h17v6h-11v6h6a8 8 0 0 1 0 16h-12v-6h11a2 2 0 0 0 0-4h-11z" fill="#000" />
      <!-- 2 -->
      <path d="M113 48h9a8 8 0 0 1 8 8c0 3-2 5-4 7l-9 7h13v6h-21v-6l13-10c1-1 2-2 2-4a2 2 0 0 0-2-2h-7z" fill="#000" />
    </mask>
  </defs>
  <!-- Heavy N: left stem, diagonal, right stem. -->
  <path d="M8 12h21l33 52V12h21v86H62L29 46v52H8z" />
  <!-- Disc with the 52 knocked out. -->
  <circle cx="108" cy="60" r="36" mask="url(#no52c)" />
</svg>
