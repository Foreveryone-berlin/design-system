name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  tokens:
    name: Tokens (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Build tokens to CSS
        run: node scripts/build-css.js

      - name: Validate tokens, generated CSS, and SVG assets
        run: npm test

      - name: Detect token drift
        run: |
          if ! git diff --quiet -- css/custom-properties.css; then
            echo "::error::css/custom-properties.css is out of sync with tokens/*.json. Run 'node scripts/build-css.js' and commit."
            git --no-pager diff -- css/custom-properties.css
            exit 1
          fi

  prototype:
    name: Prototype (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - run: npm run build

  prototype-a11y:
    name: Prototype (accessibility e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Accessibility e2e (chromium)
        run: |
          PORT=3100 npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3100/ >/dev/null
          PLAYWRIGHT_BASE_URL=http://localhost:3100 npx playwright test \
            tests/a11y.spec.ts \
            tests/interaction-a11y.spec.ts \
            tests/alt.spec.ts \
            --project=chromium
