name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  tokens:
    name: Tokens (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tokens to CSS
        run: node scripts/build-css.js

      - name: Validate tokens + generated CSS
        run: node scripts/build-css.test.js

      - name: Detect token drift
        run: |
          if ! git diff --quiet -- css/custom-properties.css; then
            echo "::error::css/custom-properties.css is out of sync with tokens/*.json. Run 'node scripts/build-css.js' and commit."
            git --no-pager diff -- css/custom-properties.css
            exit 1
          fi

  prototype:
    name: Prototype (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - run: npm run build
