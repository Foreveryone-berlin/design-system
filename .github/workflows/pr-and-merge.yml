# Create a PR into develop and merge it. Manual trigger only (workflow_dispatch).
# Push trigger removed: the repo cannot grant "Allow GitHub Actions to create and approve
# pull requests", so the script would fail in CI. Use it locally instead: bash scripts/pr-and-merge.sh
name: PR and merge into develop

on:
  workflow_dispatch:

jobs:
  pr-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and merge into develop
        run: bash scripts/pr-and-merge.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
